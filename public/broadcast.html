<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glasses Camera – Broadcast</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font-family: system-ui, -apple-system, sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  video { flex: 1; min-height: 0; width: 100%; object-fit: contain; background: #000; }
  #bar { display: flex; gap: 16px; align-items: center; padding: 10px 14px; background: #111; font-size: 18px; }
  button { font-size: 18px; padding: 10px 18px; border: 0; border-radius: 8px; background: #2d6cdf; color: #fff; }
  button:disabled { background: #2a7a3a; }
  #status { flex: 1; }
  .err { color: #ff6b6b; }
</style>
</head>
<body>
<div id="wrap">
  <video id="preview" autoplay muted playsinline></video>
  <div id="bar">
    <button id="start">Start camera</button>
    <span id="status">Connecting…</span>
    <span id="viewers">0 viewers</span>
  </div>
</div>
<script src="/broadcast.js"></script>
</body>
</html>
