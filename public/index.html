<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glasses Camera</title>
<style>
  :root { --bg: #0e0f12; --panel: #17191e; --text: #e8e9ec; --muted: #8b90a0; --accent: #4f8cff; --ok: #3ccf7a; --warn: #ffb74d; --bad: #ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid #23262e; }
  h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  .pill { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); }
  .spacer { flex: 1; }
  label { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  select, button { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 6px; border: 1px solid #2d3140; background: #1f2229; color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  main { flex: 1; min-height: 0; display: flex; background: #000; }
  #stage { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; justify-content: center; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  aside { width: 340px; flex: none; background: var(--panel); border-left: 1px solid #23262e; padding: 14px 16px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
  aside h2 { font-size: 13px; font-weight: 600; margin: 0; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  #best { font-size: 34px; font-weight: 700; line-height: 1.1; }
  #best small { font-size: 14px; color: var(--muted); font-weight: 400; margin-left: 8px; }
  #alts { font-size: 13px; color: var(--muted); line-height: 1.5; }
  #annot { width: 100%; border-radius: 6px; background: #000; display: none; }
  #annot.show { display: block; }
  #fen { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--muted); word-break: break-all; }
  #msg { font-size: 13px; color: var(--warn); min-height: 1.2em; }
  .muted { font-size: 12px; color: var(--muted); }
  #runinfo b { color: var(--bad); }
  input { font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 6px; border: 1px solid #2d3140; background: #1f2229; color: var(--text); }
  @media (max-width: 900px) { main { flex-direction: column; } aside { width: auto; border-left: 0; border-top: 1px solid #23262e; } }
  video, img { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; display: none; }
  video.show, img.show { display: block; }
  #placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--muted); text-align: center; padding: 16px; }
  #placeholder code { color: var(--text); background: #1f2229; padding: 2px 6px; border-radius: 4px; }
  footer { font-size: 12px; color: var(--muted); padding: 8px 16px; background: var(--panel); border-top: 1px solid #23262e; display: flex; gap: 20px; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <h1>Glasses Camera</h1>
  <span class="pill"><span id="dot" class="dot"></span><span id="status">Connecting…</span></span>
  <span class="spacer"></span>
  <label>Mode
    <select id="mode">
      <option value="webrtc">WebRTC (live video)</option>
      <option value="frames">Snapshot frames (JPEG)</option>
    </select>
  </label>
  <button id="snap">Save snapshot</button>
  <button id="full">Fullscreen</button>
</header>
<main>
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <img id="img" alt="">
    <canvas id="overlay"></canvas>
    <div id="placeholder">
      <div>Waiting for the glasses…</div>
      <div>Open <code id="burl"></code> in a browser on the glasses.</div>
    </div>
  </div>
  <aside>
    <h2>Chess assistant</h2>
    <div class="row">
      <button id="analyze" class="primary">Analyze board</button>
      <label><input type="checkbox" id="auto"> Auto</label>
      <label>Side
        <select id="side">
          <option value="auto">Auto</option>
          <option value="white">White</option>
          <option value="black">Black</option>
        </select>
      </label>
    </div>
    <div id="msg"></div>
    <div id="best">—</div>
    <div id="alts"></div>
    <img id="annot" alt="Recognised board">
    <div id="fen"></div>
    <h2>Field run (Part C)</h2>
    <div class="row">
      <input id="scenario" placeholder="scenario, e.g. home-wifi" style="width:150px">
      <select id="net">
        <option value="wifi">Wi-Fi</option>
        <option value="pal3">PAL3.0</option>
        <option value="5g">5G hotspot</option>
        <option value="usb">USB (adb)</option>
      </select>
      <button id="runbtn" class="primary">Start run</button>
    </div>
    <div id="runinfo" class="muted">no run</div>
    <div class="row">
      <input id="marktxt" placeholder="mark label" style="width:150px">
      <button id="markbtn">Mark</button>
      <button id="pausebtn">Pause glasses</button>
      <button id="probebtn">Probe bandwidth</button>
    </div>
    <div id="netinfo" class="muted">—</div>
    <div id="probeinfo" class="muted"></div>
  </aside>
</main>
<footer>
  <span id="info">—</span>
  <span id="fps">—</span>
</footer>
<script src="/config.js"></script>
<script src="/viewer.js"></script>
</body>
</html>
